[project]
name = "cvescout"
version = "0.1.0"
description = "Find the latest CVEs from live sources (NVD, CISA KEV, EPSS) with a Claude agent"
requires-python = ">=3.10"
dependencies = ["anthropic>=2.3"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
cvescout = "cvescout.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cvescout"]
